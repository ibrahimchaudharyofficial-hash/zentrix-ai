services:
  - type: web
    name: zentrix-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: ZENTRIX_PUBLIC_MODE
        value: "true"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PADDLE_API_KEY
        sync: false
      - key: PADDLE_CLIENT_TOKEN
        sync: false
      - key: PADDLE_WEBHOOK_SECRET_KEY
        sync: false
      - key: PADDLE_PRICE_ID_MONTHLY
        sync: false
      - key: PADDLE_PRICE_ID_LIFETIME
        sync: false
      - key: PADDLE_PRICE_ID_DONATION
        sync: false
      - key: PADDLE_CHECKOUT_URL
        sync: false
      - key: PADDLE_ENVIRONMENT
        value: sandbox
